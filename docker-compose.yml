services:
  mysql:
    image: mysql:8.0
    container_name: makcha-mysql
    restart: always # 앱 크래시, 서버 재부팅 시 자동 복구 목적임.
    env_file:
      - .env # 환경 변수 경고 오류 해결, .env 한 곳에서 통합 관리.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      # MySQL이 실제로 접속 가능한 상태인지 확인.
      # backend가 DB 준비 전에 실행되는 것을 방지함.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - makcha-network # 백엔드, mysql 통신용 브리지 네트워크

  backend:
    image: makcha-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makcha-backend # 롤백 시 같은 컨테이너를 교체하기 위한 설계.
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        # MySQL healthcheck 통과 후 backend 시작할 수 있도록 함.(중요!)
        # DB 준비 완료가 기준
        condition: service_healthy
      # ports가 없는 이유.
      # MySQL은 외부 접근 차단, 보안 문제로.
      # backend 컨테이너에서만 내부 네트워크로 접근함.
    networks:
      - makcha-network

volumes:
  mysql_data:

networks:
  makcha-network:
    driver: bridge
