name: Deploy Makcha Backend

on:
  push:
    branches:
      - develop # trigger : develop 브랜치에 push 될 때만 자동 배포.

jobs:
  deploy:
    #깃 액션 실행 환경입니다.
    runs-on: ubuntu-latest

    steps:
      # 깃 레포지토리 코드 체크아웃. 
      # 실제 배포는 EC2에서 git pull로 진행합니다. 이 단계는 액션 컨텍스트 보장을 위합니다.
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # EC2 접속을 위한 SSH 설정입니다. base64로 개인키를 복호화했으며, 이미 깃 Repository secrets에 넣었습니다.
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_BASE64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      #EC2 서버 배포 실행.
      - name: Deploy to EC2
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          
            # Bash 안전 옵션
            # -e : 에러 발생 시 즉시 종료
            # -u : 정의되지 않은 환경변수 사용 시 종료
            # -o pipefail : 파이프 중간 실패도 감지
          set -euo pipefail

          # 어디에서 실패하더라도 액션 로그 중 200줄에서 서버 로그가 자동으로 출력.
          trap 'echo "❌ Deploy failed. Showing container logs..."; docker logs --tail=200 makcha-backend || true' ERR

          # 프로젝트 디렉토리 이동함.
          cd ~/makcha-backend

          # 깃허브 develop 브랜치와 동기화를 진행합니다.
          echo "📌 Sync with GitHub develop"
          git fetch origin
          git reset --hard origin/develop

          # 배포 전, 이전 최신의 정상 백엔드 이미지를 롤백으로 백업.
          echo "🧷 Backup current backend image for rollback"
          docker tag makcha-backend:latest makcha-backend:prev || echo "No previous image to backup"

          # ❗ Prisma migration/generate is handled manually
          # 마이그레이션, 새롭게 생성된 경우는 배포 담당자만 수동 수행합니다.
          # 오류 방지를 위해 CI/CD에서는 이를 실행하지 않습니다.

          # 컨테이너 빌드 & 실행
          # 빌드 실패 시 기존 컨테이너를 유지합니다.
          echo "🚀 Build & start containers (no downtime)"
          docker-compose build backend

          echo "🚀 Start backend container"
          docker-compose up -d backend

          # 서버 가동 대기.
          echo "⏳ Wait for server warm-up"
          sleep 5

          # 컨테이너 실행 여부를 확인
          # 컨테이너 미가동 시 배포 실패 처리를 진행합니다.
          echo "🔍 Check container running"
          docker ps --format '{{.Names}}' | grep -x makcha-backend

          # 애플리케이션 헬스 확인, http 응답 실패시, 배포 실패를 확인.
          echo "🔍 Health check"
          curl -f http://localhost:3000 || {
            echo "❌ Health check failed"
            docker logs --tail=200 makcha-backend
            exit 1
          } #curl 실패시 명확한 메시지 제공.
          EOF

      # 코드 반영 여부 검증
      # 실제 컨테이너 내부 코드 확인
      - name: Verify deployment
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            echo "🔍 Verify latest code"
            docker exec makcha-backend ls src/middleware | grep rateLimit
          EOF

      # 배포 성공 알림(discord)
      - name: Notify Discord (Deploy Success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -H "Content-Type: application/json" -X POST \
          -d '{
            "embeds": [{
              "title": "✅ [DEPLOY SUCCESS] Makcha Backend",
              "color": 3066993,
              "fields": [
                { "name": "🌿 Branch", "value": "develop", "inline": true },
                { "name": "👤 Actor", "value": "'"${{ github.actor }}"'", "inline": true }
              ],
              "footer": { "text": "Makcha Backend Deployment" }
            }]
          }' $DISCORD_WEBHOOK_URL
          
       # 배포 실패 알림(discord)
      - name: Notify Discord (Deploy Failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -H "Content-Type: application/json" -X POST \
          -d '{
            "embeds": [{
              "title": "❌ [DEPLOY FAILED] Makcha Backend",
              "color": 15158332,
              "description": "배포 중 오류가 발생했습니다. GitHub Actions 로그를 확인하세요.",
              "fields": [
                { "name": "🌿 Branch", "value": "develop", "inline": true },
                { "name": "👤 Actor", "value": "'"${{ github.actor }}"'", "inline": true }
              ],
              "footer": { "text": "Makcha Backend Deployment" }
            }]
          }' $DISCORD_WEBHOOK_URL

